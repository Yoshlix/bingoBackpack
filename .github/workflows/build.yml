name: Build and Release Minecraft Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Don't let a rapid series of pushes pile up runs; only the newest matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    # The parent repo is tiny (~100 KB), so full history is free and keeps the
    # changelog step working. The bingo submodule is ~98 MB of history, so it is
    # fetched separately and shallow (~19 MB) below.
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: false

    - name: Checkout bingo submodule (shallow)
      run: git submodule update --init --recursive --depth 1

    # MC 26.2 targets Java 25; a JDK 21 cannot compile with --release 25.
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Loom's Minecraft artifacts live outside the paths setup-gradle caches by
    # default and are the bulk of a cold run.
    - name: Cache Loom artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches/fabric-loom
          .gradle/loom-cache
          bingo/.gradle/loom-cache
        key: loom-${{ runner.os }}-${{ hashFiles('gradle.properties', 'bingo/gradle.properties', 'bingo/mc26.2/gradle.properties') }}
        restore-keys: |
          loom-${{ runner.os }}-

    - name: Make gradlew executable
      run: chmod +x ./gradlew ./bingo/gradlew ./discord-service/gradlew

    - name: Get mod version
      id: get_version
      run: |
        MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d'=' -f2)
        MC_VERSION=$(grep -E '^minecraft_version=' gradle.properties | cut -d'=' -f2)
        echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT
        echo "minecraft_version=$MC_VERSION" >> $GITHUB_OUTPUT
      
    # :mc26.2:build also produces the api/common/platform jars the mod compiles
    # against, so this single invocation replaces the separate API-modules step.
    - name: Build Bingo Mod (MC 26.2)
      run: |
        cd bingo
        ./gradlew :mc26.2:build

    - name: Build with Gradle
      run: ./gradlew build

    - name: Build Discord Service
      run: |
        cd discord-service
        ./gradlew shadowJar

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: minecraft-mod
        path: |
          build/libs/bingobackpack-*.jar
          bingo/mc26.2/build/libs/bingo-*+mc26.2.jar
          discord-service/build/libs/discord-service-*-all.jar
          !build/libs/*-sources.jar
          !build/libs/*-dev.jar
          !bingo/mc26.2/build/libs/*-all.jar
          !bingo/mc26.2/build/libs/*-sources.jar
        retention-days: 30

    - name: Generate Changelog
      id: changelog
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      run: |
        # Get the previous tag or use initial commit
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        
        echo "## 🎮 BingoBackpack v${{ steps.get_version.outputs.mod_version }}" > CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "**Minecraft Version:** ${{ steps.get_version.outputs.minecraft_version }}" >> CHANGELOG.md
        echo "**Mod Version:** ${{ steps.get_version.outputs.mod_version }}" >> CHANGELOG.md
        echo "**Build:** #${{ github.run_number }}" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        
        if [ -n "$PREVIOUS_TAG" ]; then
          echo "### 📝 Changes since $PREVIOUS_TAG" >> CHANGELOG.md
        else
          echo "### 📝 Recent Changes" >> CHANGELOG.md
        fi
        echo "" >> CHANGELOG.md
        
        # Get commits since last tag or last 10 commits
        if [ -n "$PREVIOUS_TAG" ]; then
          COMMITS=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" 2>/dev/null || echo "")
        else
          COMMITS=$(git log --pretty=format:"- %s (%h)" -10 2>/dev/null || echo "")
        fi
        
        if [ -n "$COMMITS" ]; then
          echo "$COMMITS" >> CHANGELOG.md
        else
          echo "- Initial release" >> CHANGELOG.md
        fi
        
        echo "" >> CHANGELOG.md
        echo "---" >> CHANGELOG.md
        echo "📦 **Installation:** Place JAR files correctly:" >> CHANGELOG.md
        echo "- \`bingobackpack-*.jar\` >> \`mods\` folder" >> CHANGELOG.md
        echo "- \`bingo-*.jar\` >> \`mods\` folder" >> CHANGELOG.md
        echo "- \`discord-service-*-all.jar\` >> **Separate folder**, run with Java 21" >> CHANGELOG.md

    - name: Delete old release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      run: gh release delete latest --yes || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: BingoBackpack v${{ steps.get_version.outputs.mod_version }} (Build #${{ github.run_number }})
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
        files: |
          build/libs/bingobackpack-*.jar
          bingo/mc26.2/build/libs/bingo-*+mc26.2.jar
          discord-service/build/libs/discord-service-*-all.jar
          !bingo/mc26.2/build/libs/*-all.jar
          !bingo/mc26.2/build/libs/*-sources.jar
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
